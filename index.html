<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <link href="CSS/style.css" rel="stylesheet"/>
    <script src="Javascript/javascript.js" defer></script>
  </head>
  <body>
    <!-- Slideshow container-->
     <section class="slideShow-container">
        
      <!-- Full-width-->
        <section class="mySlides fade">
          <div class="numbertext">1 / 3</div>
          <img src="image/Appleseed/Appleseed.png" alt='appleseed' style="width:100%">
          <div class="text">Caption Text</div>
        </section>

        <section class="mySlides fade">
          <div class="numbertext">2 / 3</div>
          <img src="image/Appleseed/Deunan_and_AF5.jpg" alt="appleseed/deunan" style="width:100%">
          <div class="text">Caption Text</div>
        </section>

        <section class="mySlides fade">
          <div class="numbertext">3 / 3</div>
          <img src="image/Appleseed/tumblr_n93b6uijlB1s5oxc0o2_500.gif" alt="appleseed/tumbler_duenan" style="width:100%">
          <div class="text">Caption Text</div>
        </section>

        <!-- Next and previous buttons -->
        <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
        <a class="next" onclick="plusSlides(1)">&#10095;</a>

     </section>
     <br>

     <!-- the dots/circles-->
      <secton style="text-align:center">
        <span class="dot" onclick="currentSlide(1)"></span>
        <span class="dot" onclick="currentSlide(2)"></span>
        <span class="dot" onclick="currentSlide(3)"></span>
      </secton>
  </body>
</html>
